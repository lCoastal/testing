name: Validate Luau

on:
  push:
    branches: [main]
    paths:
      - '**.luau'
      - '.github/workflows/validate-luau.yml'
  pull_request:
    paths:
      - '**.luau'
      - '.github/workflows/validate-luau.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Luau compiler
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/luau/build --target Luau.Compile.CLI --parallel 2
      - name: Compile every repository Luau file
        run: |
          COMPILER=/tmp/luau/build/luau-compile
          test -x "$COMPILER"
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            "$COMPILER" "$file" >/dev/null
          done < <(find . -type f -name '*.luau' -print0)
